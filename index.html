<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Berlin · MLcon week</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --paper:#f3f0e8; --ink:#141414; --yellow:#f0d722; --rule:#ddd8cb; --mute:#6d6a63;
    --display:'Barlow Condensed', sans-serif; --body:'Barlow', sans-serif;
    --sheet:46vh; --target:24px;
    --safe-l:max(10px, env(safe-area-inset-left, 0px)); --safe-r:max(10px, env(safe-area-inset-right, 0px));
  }
  @media (pointer: coarse) { :root { --target:44px; } }
  :where(button, a.btn) { min-block-size:var(--target); min-inline-size:var(--target); }
  h1, h2, h3 { text-wrap:balance; }
  ul, ol { list-style:none; margin:0; padding:0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:15px/1.35 var(--body); }
  button { font:inherit; color:inherit; cursor:pointer; }
  #map { position:fixed; inset:0; }

  /* ---- header: station sign ---- */
  .top { position:fixed; top:0; left:0; right:0; z-index:10; padding:calc(env(safe-area-inset-top, 0px) + 10px) var(--safe-r) 0 var(--safe-l); pointer-events:none; }
  .sign { pointer-events:auto; display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff; border-radius:12px;
          padding:8px 12px 8px 8px; box-shadow:0 6px 20px #0003; }
  .sign .u { width:34px; height:34px; border-radius:7px; background:var(--yellow); color:var(--ink); display:grid; place-items:center;
             font:800 24px/1 var(--display); }
  .sign h1 { margin:0; font:700 21px/1 var(--display); letter-spacing:.04em; text-transform:uppercase; }
  .sign small { display:block; font:500 12px/1.2 var(--body); color:#bdb9ae; letter-spacing:.02em; margin-top:2px; }
  .sign .gps { margin-left:auto; font:600 12px/1 var(--display); letter-spacing:.06em; text-transform:uppercase; color:#bdb9ae;
               display:flex; align-items:center; gap:6px; text-align:right; }
  .sign .gps i { width:8px; height:8px; border-radius:50%; background:#777; flex:none; }
  .sign .gps.live i { background:#38d26b; box-shadow:0 0 0 3px #38d26b33; }
  .chips { pointer-events:auto; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:8px 0 10px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:7px; border:0; background:#fff; border-radius:8px; padding:4px 12px 4px 8px;
          font:600 14px/1 var(--body); box-shadow:0 2px 8px #0002; transition:opacity .15s, transform .15s; }
  .chip:active { transform:scale(.96); }
  .chip[aria-pressed="false"] { opacity:.5; box-shadow:none; }
  .badge { width:26px; height:22px; border-radius:5px; display:grid; place-items:center; color:#fff; flex:none;
           font:700 13px/1 var(--display); letter-spacing:.02em; }

  /* ---- floating actions ---- */
  .fab { position:fixed; right:var(--safe-r); z-index:10; display:flex; flex-direction:column; gap:8px; bottom:calc(var(--sheet) + 12px); transition:bottom .25s; }
  .fab button { border:0; background:var(--ink); color:#fff; border-radius:10px; padding:10px 13px; font:700 14px/1 var(--display);
                letter-spacing:.06em; text-transform:uppercase; box-shadow:0 4px 14px #0004; }
  .fab button.y { background:var(--yellow); color:var(--ink); }

  /* ---- sheet ---- */
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; height:var(--sheet); background:var(--paper); border-top:3px solid var(--ink);
           border-radius:18px 18px 0 0; display:flex; flex-direction:column; transition:height .25s; padding:0 var(--safe-r) env(safe-area-inset-bottom, 0px) var(--safe-l);
           box-shadow:0 -10px 30px #0002; }
  body.min { --sheet:calc(62px + env(safe-area-inset-bottom)); }
  .grip { position:absolute; top:-3px; left:50%; transform:translateX(-50%); width:72px; min-block-size:30px; border:0; background:none; }
  .grip::after { content:''; position:absolute; top:9px; left:12px; right:12px; height:4px; border-radius:2px; background:var(--rule); }
  .bar { display:flex; align-items:center; gap:10px; padding:20px 4px 10px; }
  .seg { display:flex; background:#e6e2d7; border-radius:9px; padding:3px; }
  .seg button { border:0; background:none; padding:7px 16px; border-radius:7px; font:700 15px/1 var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .status { margin-left:auto; font-size:12px; color:var(--mute); text-align:right; max-width:42%; }
  .body { overflow-y:auto; flex:1; padding:0 4px 16px; overscroll-behavior:contain; }
  .kicker { font:700 12px/1.2 var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:12px 0 4px; }

  .row { display:flex; gap:11px; align-items:center; padding:10px 0; border-bottom:1px solid var(--rule); animation:up .35s both; }
  .t { flex:1; min-width:0; border:0; background:none; padding:0; text-align:left; }
  .row .n { font-weight:600; }
  .row .s { font-size:13px; color:var(--mute); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row .s b { color:var(--ink); font:700 13px/1 var(--display); letter-spacing:.04em; }
  .add { flex:none; width:38px; height:38px; border-radius:50%; border:2px solid var(--ink); background:#fff; font:700 20px/1 var(--display); display:grid; place-items:center; }
  .add.on { background:var(--yellow); }
  @keyframes up { from { opacity:0; transform:translateY(6px); } }

  /* ---- plan as a U-Bahn line ---- */
  .days { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
  .day { flex:none; border:2px solid var(--ink); background:#fff; border-radius:8px; padding:6px 10px; font:700 15px/1 var(--display); letter-spacing:.04em; text-transform:uppercase; }
  .day[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .day sup { font-size:11px; color:var(--yellow); margin-left:2px; }
  .day[aria-pressed="false"] sup { color:var(--mute); }
  .hint { font-size:13px; color:var(--mute); margin:8px 0 4px; }
  .line { position:relative; margin:10px 0 4px; }
  .line::before { content:''; position:absolute; left:13px; top:14px; bottom:14px; width:8px; background:var(--yellow); border:2px solid var(--ink); border-radius:4px; }
  .stn { position:relative; animation:up .35s both; }
  .stn .r { display:flex; align-items:center; gap:12px; padding:6px 0; }
  .stn .o { flex:none; width:34px; height:34px; border-radius:50%; background:#fff; border:3px solid var(--ink); display:grid; place-items:center;
            font:800 15px/1 var(--display); z-index:1; }
  .stn .t { flex:1; min-width:0; }
  .stn .n { font:700 17px/1.1 var(--display); letter-spacing:.02em; text-transform:uppercase; }
  .stn .s { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); margin-top:3px; }
  .stn .s .badge { width:22px; height:16px; font-size:11px; }
  .ctl { display:flex; gap:2px; }
  .ctl button { border:0; background:none; width:32px; height:32px; border-radius:6px; font-size:15px; color:var(--mute); }
  .ctl button:active { background:#e6e2d7; }
  .leg { padding:1px 0 1px 46px; font:600 12px/1.6 var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .btn { border:2px solid var(--ink); background:#fff; border-radius:9px; padding:8px 12px; font:700 14px/1 var(--display); letter-spacing:.06em;
         text-transform:uppercase; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
  .btn.pri { background:var(--ink); color:#fff; }
  .btn.y { background:var(--yellow); }
  .empty { color:var(--mute); padding:14px 0; }

  /* ---- map marks ---- */
  .pin { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:14px; border:2.5px solid #fff; box-shadow:0 2px 6px #0005; cursor:pointer; }
  .pin.osm { width:13px; height:13px; border-width:2px; font-size:0; }
  .num { width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--ink); display:grid; place-items:center; font:800 13px/1 var(--display); pointer-events:none; }
  .me { width:18px; height:18px; border-radius:50%; background:#2f6fe4; border:3px solid #fff; box-shadow:0 0 0 0 #2f6fe480; animation:pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 14px #2f6fe400; } 100% { box-shadow:0 0 0 0 #2f6fe400; } }
  .maplibregl-popup-content { background:var(--paper); border:2px solid var(--ink); border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px #0003; font-family:var(--body); min-width:210px; }
  .maplibregl-popup-tip { display:none; }
  .maplibregl-popup-close-button { font-size:20px; padding:2px 8px; }
  .pop h3 { margin:0 24px 4px 0; font:700 19px/1.1 var(--display); text-transform:uppercase; letter-spacing:.02em; }
  .pop .m { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); }
  .pop p { margin:8px 0 10px; font-size:14px; }
  .pop .acts { margin:0; }
  .maplibregl-ctrl-attrib { font-size:10px; }
  :focus-visible { outline:3px solid #2f6fe4; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<header class="top">
  <div class="sign">
    <div class="u" aria-hidden="true">U</div>
    <div><h1>Berlin</h1><small>MLcon week · Nov 17–20</small></div>
    <div class="gps" id="gps" role="status"><i aria-hidden="true"></i><span>No fix</span></div>
  </div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</header>

<div class="fab">
  <button id="btnHotel">⌂ Hotel</button>
  <button id="btnMe">◎ Me</button>
  <button id="btnLive" class="y">Scan here</button>
</div>

<main class="sheet" id="sheet">
  <button class="grip" data-grip aria-label="Collapse panel" aria-expanded="true"></button>
  <div class="bar">
    <div class="seg">
      <button data-tab="near" aria-pressed="true">Nearby</button>
      <button data-tab="plan" aria-pressed="false">Plan</button>
    </div>
    <span class="status" id="status" role="status"></span>
  </div>
  <div class="body" id="body"></div>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="places.js"></script>
<script>
// ---------- Categories (styled as Berlin U-Bahn lines) ----------
const CATS = {
  base:   { code:'S',  label:'Base',       icon:'🏨', color:'#141414', osm:[] },
  food:   { code:'U2', label:'Food',       icon:'🍜', color:'#da421e', osm:['["amenity"~"^(restaurant|fast_food)$"]'] },
  coffee: { code:'U5', label:'Coffee',     icon:'☕', color:'#7e5330', osm:['["amenity"="cafe"]'] },
  pubs:   { code:'U8', label:'Pubs & bars',icon:'🍺', color:'#224f86', osm:['["amenity"~"^(pub|bar|biergarten)$"]'] },
  music:  { code:'U6', label:'Live music', icon:'🎷', color:'#8c6dab', osm:['["amenity"~"^(music_venue|nightclub)$"]'] },
  sights: { code:'U3', label:'Sights',     icon:'🏛️', color:'#16683d', osm:['["tourism"~"^(attraction|museum|gallery|viewpoint)$"]'] },
  needs:  { code:'U1', label:'Essentials', icon:'🧴', color:'#7dad4c', osm:['["amenity"~"^(pharmacy|atm)$"]','["shop"="supermarket"]'] },
};
const badge = c => `<span class="badge" aria-hidden="true" style="background:${CATS[c].color}">${CATS[c].code}</span>`;

// ---------- State ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const S = {
  cats: new Set(store.get('cats', Object.keys(CATS))),
  plan: store.get('plan', Object.fromEntries(DAYS.map(d => [d.k, []]))),
  day: store.get('day', 'tue'),
  tab: 'near', me: null, live: [],
};
const save = () => { store.set('cats', [...S.cats]); store.set('plan', S.plan); store.set('day', S.day); };
const byId = id => PICKS.find(p => p.id === id) || S.live.find(p => p.id === id) || Object.values(S.plan).flat().find(p => p.id === id);

// ---------- Geo helpers ----------
const dist = (a, b) => {
  const R = 6371e3, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const walk = m => m > 4000 ? `${(m/1000).toFixed(1)} km · transit` : `${Math.max(1, Math.round(m * 1.25 / 80))} min walk`;
const origin = () => S.me || VENUE;
const ll = p => [p.lng, p.lat];
const mapsLink = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + p.lat + ',' + p.lng)}`;
const routeLink = stops => {
  const f = p => `${p.lat},${p.lng}`, [o, ...rest] = stops, d = rest.pop();
  return `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${f(o)}&destination=${f(d)}` +
         (rest.length ? `&waypoints=${rest.map(f).join('|')}` : '');
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const el = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };

// ---------- Map (MapLibre + OpenFreeMap, no API key) ----------
const map = new maplibregl.Map({
  container:'map', style:'https://tiles.openfreemap.org/styles/positron',
  center: ll(VENUE), zoom:14, attributionControl:{ compact:true },
});
let mapReady = false, marks = new Map(), meMarker = null;

map.on('load', () => {
  map.addSource('route', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
  map.addLayer({ id:'route-casing', type:'line', source:'route', layout:{ 'line-join':'round', 'line-cap':'round' }, paint:{ 'line-color':'#141414', 'line-width':10 } });
  map.addLayer({ id:'route-fill', type:'line', source:'route', layout:{ 'line-join':'round', 'line-cap':'round' }, paint:{ 'line-color':'#f0d722', 'line-width':5 } });
  mapReady = true;
  render();
});

const popupHtml = p => `<div class="pop"><h3>${esc(p.name)}</h3>
  <div class="m">${badge(p.cat)} ${CATS[p.cat].label}${p.src === 'osm' ? ' · OSM' : ''} · ${walk(dist(origin(), p))}</div>
  <p>${esc(p.note || '')}</p>
  <div class="acts">${addLabel(p)}<a class="btn" href="${mapsLink(p)}" target="_blank" rel="noopener">Maps ↗</a></div></div>`;

const visible = () => [...PICKS, ...S.live].filter(p => S.cats.has(p.cat));

function renderMap() {
  if (!mapReady) return;
  marks.forEach(m => m.remove()); marks.clear();
  visible().forEach(p => {
    const node = el(`<div class="pin ${p.src === 'osm' ? 'osm' : ''}" style="background:${CATS[p.cat].color}">${CATS[p.cat].icon}</div>`);
    const m = new maplibregl.Marker({ element:node }).setLngLat(ll(p))
      .setPopup(new maplibregl.Popup({ offset:16, maxWidth:'280px' }).setHTML(popupHtml(p))).addTo(map);
    marks.set(p.id, m);
  });
  const stops = S.plan[S.day];
  map.getSource('route').setData({ type:'FeatureCollection', features: stops.length > 1
    ? [{ type:'Feature', geometry:{ type:'LineString', coordinates: stops.map(ll) } }] : [] });
  stops.forEach((p, i) => {
    const m = new maplibregl.Marker({ element: el(`<div class="num">${i+1}</div>`), offset:[0,-24] }).setLngLat(ll(p)).addTo(map);
    marks.set('stop' + i, m);
  });
}

// ---------- UI ----------
const inPlan = p => S.plan[S.day].some(s => s.id === p.id);
const dayLabel = () => DAYS.find(d => d.k === S.day).label;
const addLabel = p => inPlan(p) ? `<span class="btn y">✓ ${dayLabel()}</span>` : `<button class="btn pri" data-add="${p.id}">+ ${dayLabel()}</button>`;
const addDot = p => inPlan(p) ? `<span class="add on" aria-label="In ${dayLabel()} plan" role="img">✓</span>` : `<button class="add" data-add="${p.id}" aria-label="Add ${esc(p.name)} to ${dayLabel()}">+</button>`;

const row = (p, from, i) => `<li class="row" style="animation-delay:${Math.min(i, 12) * 25}ms">
  ${badge(p.cat)}
  <button class="t" data-focus="${p.id}"><span class="n">${esc(p.name)}</span><span class="s"><b>${walk(dist(from, p))}</b> · ${CATS[p.cat].label}${p.src === 'osm' ? ' · OSM' : ''}${p.note ? ' · ' + esc(p.note) : ''}</span></button>
  ${addDot(p)}</li>`;
const rows = (list, from) => `<ul>${list.map((p, i) => row(p, from, i)).join('')}</ul>`;

const nearest = (from, n, exclude = []) => visible()
  .filter(p => p.cat !== 'base' && !exclude.some(e => e.id === p.id))
  .map(p => [dist(from, p), p]).sort((a, b) => a[0] - b[0]).slice(0, n).map(x => x[1]);

const renderChips = () => document.getElementById('chips').innerHTML = Object.entries(CATS).map(([k, c]) =>
  `<button class="chip" aria-pressed="${S.cats.has(k)}" data-cat="${k}">${badge(k)}${c.label}</button>`).join('');

function renderNear() {
  const from = origin(), list = nearest(from, 60);
  return `<h2 class="kicker">From ${S.me ? 'your location' : 'the venue'} · ${list.length} places</h2>` +
    (list.length ? rows(list, from) : '<p class="empty">Turn on a line above.</p>');
}

function renderPlan() {
  const d = DAYS.find(x => x.k === S.day), stops = S.plan[S.day];
  let h = `<div class="days">${DAYS.map(x => `<button class="day" aria-pressed="${x.k === S.day}" data-day="${x.k}">${x.label}<sup aria-label="${S.plan[x.k].length} stops">${S.plan[x.k].length}</sup></button>`).join('')}</div>
    <div class="hint">${d.hint}</div>`;
  let total = 0;
  if (stops.length) {
    h += `<ol class="line" aria-label="${d.label} route">`;
    stops.forEach((p, i) => {
      const leg = i ? dist(stops[i-1], p) : 0; total += leg;
      h += `<li class="stn" style="animation-delay:${i * 40}ms">${i ? `<div class="leg">${walk(leg)}</div>` : ''}
        <div class="r"><span class="o" aria-hidden="true">${i+1}</span>
        <button class="t" data-focus="${p.id}"><span class="n">${esc(p.name)}</span><span class="s">${badge(p.cat)} ${CATS[p.cat].label}</span></button>
        <div class="ctl"><button data-mv="${i},-1" aria-label="Move ${esc(p.name)} up">↑</button><button data-mv="${i},1" aria-label="Move ${esc(p.name)} down">↓</button><button data-rm="${i}" aria-label="Remove ${esc(p.name)}">✕</button></div></div></li>`;
    });
    h += '</ol>';
  } else h += `<p class="empty">No stops yet. Load the suggested line or add places with +.</p>`;
  h += `<div class="acts"><button class="btn y" data-suggest>Load suggested</button>
    ${stops.length > 1 ? `<a class="btn pri" href="${routeLink(stops)}" target="_blank" rel="noopener">Walk it ↗</a>` : ''}
    ${stops.length ? `<button class="btn" data-clear>Clear</button>` : ''}</div>`;
  if (stops.length > 1) h += `<div class="hint">≈ ${(total/1000).toFixed(1)} km between stops</div>`;
  const last = stops[stops.length - 1] || origin();
  h += `<h2 class="kicker">Next from ${stops.length ? esc(last.name) : (S.me ? 'you' : 'the venue')}</h2>` + rows(nearest(last, 8, stops), last);
  return h;
}

function render() {
  renderChips();
  document.querySelectorAll('[data-tab]').forEach(t => t.setAttribute('aria-pressed', t.dataset.tab === S.tab));
  document.getElementById('body').innerHTML = S.tab === 'near' ? renderNear() : renderPlan();
  renderMap();
  save();
}
const status = t => document.getElementById('status').textContent = t;

// ---------- Live scan (OpenStreetMap / Overpass) ----------
async function liveSearch() {
  const c = map.getCenter(), r = 900;
  const sels = [...S.cats].flatMap(k => CATS[k].osm.map(s => [k, s]));
  if (!sels.length) return status('Turn on a line first');
  status('Scanning OpenStreetMap…');
  const q = `[out:json][timeout:20];(${sels.map(([, s]) => `nwr${s}["name"](around:${r},${c.lat},${c.lng});`).join('')});out center 150;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', { method:'POST', body:'data=' + encodeURIComponent(q) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { elements } = await res.json();
    const catOf = t => sels.find(([, s]) => {
      const [, key, op, val] = s.match(/\["(\w+)"(~|=)"(.+?)"\]/);
      return op === '=' ? t[key] === val : new RegExp(val).test(t[key] || '');
    })?.[0];
    const known = new Set(PICKS.map(p => p.name.toLowerCase()));
    const found = elements.map(e => ({
      id: 'osm' + e.type[0] + e.id, src:'osm', name: e.tags.name, cat: catOf(e.tags),
      lat: e.lat ?? e.center.lat, lng: e.lon ?? e.center.lon,
      note: [e.tags.cuisine?.replace(/;/g, ', '), e.tags.opening_hours].filter(Boolean).join(' · '),
    })).filter(p => p.cat && !known.has(p.name.toLowerCase()));
    const ids = new Set(S.live.map(p => p.id));
    S.live.push(...found.filter(p => !ids.has(p.id)));
    status(`${found.length} found nearby`);
    render();
  } catch (e) { status('Scan failed: ' + e.message); }
}

// ---------- Geolocation ----------
function locate(fly) {
  const gps = document.getElementById('gps');
  if (!navigator.geolocation) return gps.querySelector('span').textContent = 'No GPS';
  navigator.geolocation.getCurrentPosition(pos => {
    S.me = { id:'me', cat:'base', name:'You', lat: pos.coords.latitude, lng: pos.coords.longitude };
    meMarker ??= new maplibregl.Marker({ element: el('<div class="me"></div>') }).setLngLat(ll(S.me)).addTo(map);
    meMarker.setLngLat(ll(S.me));
    if (fly) map.flyTo({ center: ll(S.me), zoom:15.5 });
    gps.classList.add('live'); gps.querySelector('span').textContent = `±${Math.round(pos.coords.accuracy)} m`;
    render();
  }, err => { gps.classList.remove('live'); gps.querySelector('span').textContent = err.code === 1 ? 'GPS denied' : 'No fix'; },
  { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}

// ---------- Events ----------
const focus = p => { map.flyTo({ center: ll(p), zoom:16.5 }); const m = marks.get(p.id); if (m && !m.getPopup().isOpen()) m.togglePopup(); };
const add = p => { if (!inPlan(p)) S.plan[S.day].push(p); marks.forEach(m => m.getPopup()?.remove()); render(); };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-tab],[data-day],[data-add],[data-mv],[data-rm],[data-suggest],[data-clear],[data-focus],[data-grip]');
  if (!t) return;
  const ds = t.dataset, stops = S.plan[S.day];
  if ('grip' in ds) { const min = document.body.classList.toggle('min'); t.setAttribute('aria-expanded', !min); t.setAttribute('aria-label', min ? 'Expand panel' : 'Collapse panel'); return; }
  if (ds.cat) { S.cats.has(ds.cat) ? S.cats.delete(ds.cat) : S.cats.add(ds.cat); }
  else if (ds.tab) { S.tab = ds.tab; document.body.classList.remove('min'); document.querySelector('[data-grip]').setAttribute('aria-expanded', true); }
  else if (ds.day) S.day = ds.day;
  else if (ds.add) return add(byId(ds.add));
  else if (ds.mv) { const [i, d] = ds.mv.split(',').map(Number), j = i + d; if (j < 0 || j >= stops.length) return; [stops[i], stops[j]] = [stops[j], stops[i]]; }
  else if (ds.rm) stops.splice(+ds.rm, 1);
  else if ('suggest' in ds) S.plan[S.day] = DAYS.find(d => d.k === S.day).suggest.map(byId);
  else if ('clear' in ds) S.plan[S.day] = [];
  else if (ds.focus) return focus(byId(ds.focus));
  render();
});
document.getElementById('btnHotel').onclick = () => focus(HOTEL);
document.getElementById('btnMe').onclick = () => locate(true);
document.getElementById('btnLive').onclick = liveSearch;

render();
locate(false);
</script>
